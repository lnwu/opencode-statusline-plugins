name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check changelogs
        run: bun run changelog:check

      - name: Build
        run: bun run build

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # Pinned on purpose: the integration harness depends on opencode's TUI
      # plugin loading and managed-service behavior.
      - name: Install OpenCode CLI
        env:
          OPENCODE_VERSION: "2.0.5"
        run: |
          # `--trust` runs the package postinstall that downloads the platform binary.
          bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/opencode" --version

      - name: Integration tests (real TUI)
        env:
          # Repo secret name; the tests read it as OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: bun run --filter opencode-go-statusline test

      - name: Publish TUI frames to the job summary
        if: always()
        run: |
          dir=packages/opencode-go-statusline/test/e2e/.artifacts
          {
            echo "## TUI frames"
            echo
            shopt -s nullglob
            files=("$dir"/*.txt)
            if (( ${#files[@]} == 0 )); then
              echo "_No frames captured._"
            fi
            for file in "${files[@]}"; do
              echo "### $(basename "$file" .txt)"
              echo
              echo '```text'
              cat "$file"
              echo '```'
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TUI frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames
          path: packages/opencode-go-statusline/test/e2e/.artifacts
          if-no-files-found: ignore
          # The artifact directory is dot-prefixed, which upload-artifact treats
          # as hidden and skips by default.
          include-hidden-files: true
