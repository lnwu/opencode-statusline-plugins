name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run: exercises the real-TUI integration jobs without a main push.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: the integration harness depends on opencode's TUI
  # plugin loading and managed-service behavior. Renovate tracks this value.
  OPENCODE_VERSION: "2.0.10"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Check formatting
        run: bun run fmt:check

      - name: Unit tests
        run: |
          # Run each package's script in its own directory instead of
          # `bun run --filter`: filter mode prefixes every output line with
          # "<package> <script>: ", and the runner only parses a workflow
          # command when the line starts with `::` — the prefix buried Bun's
          # `::group::` test groups in plain text, so the UI never collapsed
          # them. Packages without the script are skipped, like `--if-present`.
          for dir in packages/*/; do
            pkg="$dir/package.json"
            if [[ -f "$pkg" ]] && grep -q '"test":' "$pkg"; then
              (cd "$dir" && bun run test)
            fi
          done

      - name: Check changelogs
        run: bun run changelog:check

      - name: Build
        run: bun run build

      - name: Packaging smoke test
        run: |
          # Same in-place loop as the unit tests: `bun run --filter` would
          # prefix each line and keep the runner from parsing Bun's
          # `::group::` commands.
          for dir in packages/*/; do
            pkg="$dir/package.json"
            if [[ -f "$pkg" ]] && grep -q '"test:pack":' "$pkg"; then
              (cd "$dir" && bun run test:pack)
            fi
          done

  # Real-TUI integration jobs: main pushes (and manual runs) only, never on
  # pull requests. They need live credentials and network, and they are
  # informational — the `ci` gate below only requires `checks`.
  go_integration:
    name: go (real TUI)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test opencode-go-statusline (real TUI)
        uses: ./.github/actions/e2e
        with:
          package: opencode-go-statusline
        env:
          # Repo secret name; the tests read it as OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}

      - name: Upload TUI frames (go)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames-go
          path: /tmp/tui-frames/opencode-go-statusline
          if-no-files-found: ignore
          include-hidden-files: false

  copilot_integration:
    name: copilot (real TUI)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test opencode-copilot-statusline (real TUI)
        uses: ./.github/actions/e2e
        with:
          package: opencode-copilot-statusline
        env:
          # Repo secret name; the tests read it as COPILOT_GITHUB_TOKEN. Any
          # Copilot-enabled account works, including Copilot Free.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Upload TUI frames (copilot)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames-copilot
          path: /tmp/tui-frames/opencode-copilot-statusline
          if-no-files-found: ignore
          include-hidden-files: false

  kimi_integration:
    name: kimi (real TUI)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test opencode-kimi-code-statusline (real TUI)
        uses: ./.github/actions/e2e
        with:
          package: opencode-kimi-code-statusline
        env:
          # Repo secret name; the tests read it as KIMI_CODE_API_KEY and register
          # it under the KIMI_API_KEY env-connection name the integration declares.
          KIMI_CODE_API_KEY: ${{ secrets.KIMI_CODE_API_KEY }}

      - name: Upload TUI frames (kimi)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames-kimi
          path: /tmp/tui-frames/opencode-kimi-code-statusline
          if-no-files-found: ignore
          include-hidden-files: false

  # The `main-protection` ruleset requires a check named `ci`, so this fan-in
  # job stays named `ci` and fails unless `checks` succeeded. The integration
  # jobs run on main only and stay informational: their results are echoed and
  # their frames published, but they never gate a merge. The job runs even when
  # a dependency fails so the required check reports the failure.
  ci:
    name: ci
    if: always()
    needs: [checks, go_integration, copilot_integration, kimi_integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify checks succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          GO: ${{ needs.go_integration.result }}
          COPILOT: ${{ needs.copilot_integration.result }}
          KIMI: ${{ needs.kimi_integration.result }}
        run: |
          echo "checks=$CHECKS go=$GO copilot=$COPILOT kimi=$KIMI"
          if [[ "$CHECKS" != "success" ]]; then
            echo "::error::the checks job did not succeed"
            exit 1
          fi

      # Frames are published even when an integration job failed: they are the
      # most useful artifact for debugging a failed case.
      - name: Download TUI frames
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          # One artifact per package; not merging keeps them in per-statusline
          # folders under `frames/`.
          pattern: tui-frames-*
          path: frames
          merge-multiple: false

      - name: Publish TUI frames to the job summary
        if: always()
        run: |
          {
            echo "## TUI frames"
            echo
            found=0
            shopt -s nullglob
            for dir in frames/tui-frames-*/; do
              label="$(basename "$dir")"
              label="${label#tui-frames-}"
              files=("$dir"*.txt)
              for file in "${files[@]}"; do
                found=1
                echo "<details>"
                echo "<summary>${label} · $(basename "$file" .txt)</summary>"
                echo
                echo '```text'
                cat "$file"
                echo '```'
                echo
                echo "</details>"
                echo
              done
            done
            if (( ! found )); then
              echo "_No frames captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
