name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: the integration harness depends on opencode's TUI
  # plugin loading and managed-service behavior. Renovate tracks this value.
  OPENCODE_VERSION: "2.0.7"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Core unit tests
        run: bun run --filter core test

      - name: Check changelogs
        run: bun run changelog:check

      - name: Build
        run: bun run build

      - name: Packaging smoke test
        run: bun run --filter './packages/*' --if-present test:pack

  go_integration:
    name: go (real TUI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # `--trust` runs the package postinstall that downloads the platform binary.
      - name: Install OpenCode CLI
        run: |
          bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/opencode" --version

      - name: Integration tests (Go, real TUI)
        env:
          # Repo secret name; the tests read it as OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: bun run --filter opencode-go-statusline test

      - name: Stage TUI frames
        if: always()
        run: |
          mkdir -p /tmp/tui-frames/opencode-go-statusline
          shopt -s nullglob
          files=(packages/opencode-go-statusline/test/e2e/.artifacts/*.txt)
          if (( ${#files[@]} > 0 )); then
            cp "${files[@]}" /tmp/tui-frames/opencode-go-statusline/
          fi

      - name: Upload TUI frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Both integration jobs merge into one artifact, each under its own
          # package folder, so the frames stay grouped per statusline.
          name: tui-frames
          path: /tmp/tui-frames
          if-no-files-found: ignore
          include-hidden-files: false

  copilot_integration:
    name: copilot (real TUI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # `--trust` runs the package postinstall that downloads the platform binary.
      - name: Install OpenCode CLI
        run: |
          bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/opencode" --version

      - name: Probe Copilot API (temporary diagnostic)
        env:
          TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          user=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" \
            -H "X-GitHub-Api-Version: 2025-04-01" https://api.github.com/copilot_internal/user)
          api=$(echo "$user" | jq -r '.endpoints.api // "https://api.githubcopilot.com"')
          echo "endpoints.api=$api"
          echo "premium: $(echo "$user" | jq -c '.quota_snapshots.premium_interactions')"
          echo "chat: $(echo "$user" | jq -c '.quota_snapshots.chat')"
          curl -sS "$api/models" -H "Authorization: Bearer $TOKEN" -H "User-Agent: opencode" \
            -H "X-GitHub-Api-Version: 2026-08-01" -o /tmp/models.json
          echo "gpt-5-mini: $(jq -c '.data[] | select(.id=="gpt-5-mini") | {id, model_picker_enabled, policy, supported_endpoints, billing, supports: .capabilities.supports}' /tmp/models.json)"
          curl -sS https://api.github.com/copilot_internal/v2/token -H "Authorization: Bearer $TOKEN" \
            -H "User-Agent: opencode" -o /tmp/ct.json
          echo "v2/token keys: $(jq -r 'keys | join(",")' /tmp/ct.json 2>/dev/null)"
          CT=$(jq -r '.token // empty' /tmp/ct.json 2>/dev/null)
          for mode in github copilot; do
            if [ "$mode" = github ]; then AUTH="$TOKEN"; else AUTH="$CT"; fi
            [ -n "$AUTH" ] || continue
            code=$(curl -sS -o /tmp/chat.json -w '%{http_code}' -X POST "$api/chat/completions" \
              -H "Authorization: Bearer $AUTH" -H "Content-Type: application/json" \
              -H "User-Agent: opencode" -H "X-GitHub-Api-Version: 2025-04-01" \
              -H "Copilot-Integration-Id: vscode-chat" -H "Editor-Version: vscode/1.104.0" \
              -d '{"model":"gpt-5-mini","messages":[{"role":"user","content":"Reply with the single word: ok"}]}')
            echo "chat gpt-5-mini [$mode token + editor headers] http=$code"
            head -c 250 /tmp/chat.json; echo
          done

      - name: Integration tests (Copilot, real TUI)
        env:
          # Repo secret name; the tests read it as COPILOT_GITHUB_TOKEN. Any
          # Copilot-enabled account works, including Copilot Free.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bun run --filter opencode-copilot-statusline test

      - name: Stage TUI frames
        if: always()
        run: |
          mkdir -p /tmp/tui-frames/opencode-copilot-statusline
          shopt -s nullglob
          files=(packages/opencode-copilot-statusline/test/e2e/.artifacts/*.txt)
          if (( ${#files[@]} > 0 )); then
            cp "${files[@]}" /tmp/tui-frames/opencode-copilot-statusline/
          fi

      - name: Upload TUI frames
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Both integration jobs merge into one artifact, each under its own
          # package folder, so the frames stay grouped per statusline.
          name: tui-frames
          path: /tmp/tui-frames
          if-no-files-found: ignore
          include-hidden-files: false

  # The `main-protection` ruleset requires a check named `ci`, so this fan-in
  # job stays named `ci` and fails unless every job above succeeded. It runs
  # even when a dependency fails so the required check reports the failure.
  ci:
    name: ci
    if: always()
    needs: [checks, go_integration, copilot_integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          GO: ${{ needs.go_integration.result }}
          COPILOT: ${{ needs.copilot_integration.result }}
        run: |
          echo "checks=$CHECKS go=$GO copilot=$COPILOT"
          if [[ "$CHECKS" != "success" || "$GO" != "success" || "$COPILOT" != "success" ]]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi

      # Frames are published even when an integration job failed: they are the
      # most useful artifact for debugging a failed case.
      - name: Download TUI frames
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: tui-frames
          path: frames

      - name: Publish TUI frames to the job summary
        if: always()
        run: |
          {
            echo "## TUI frames"
            echo
            found=0
            shopt -s nullglob
            for dir in frames/*/; do
              pkg="$(basename "$dir")"
              files=("$dir"*.txt)
              for file in "${files[@]}"; do
                found=1
                echo "<details>"
                echo "<summary>${pkg} · $(basename "$file" .txt)</summary>"
                echo
                echo '```text'
                cat "$file"
                echo '```'
                echo
                echo "</details>"
                echo
              done
            done
            if (( ! found )); then
              echo "_No frames captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
