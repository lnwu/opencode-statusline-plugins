name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned on purpose: the integration harness depends on opencode's TUI
  # plugin loading and managed-service behavior. Renovate tracks this value.
  OPENCODE_VERSION: "2.0.9"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Core unit tests
        run: bun run --filter core test

      - name: Check changelogs
        run: bun run changelog:check

      - name: Build
        run: bun run build

      - name: Packaging smoke test
        run: bun run --filter './packages/*' --if-present test:pack

  go_integration:
    name: go (real TUI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # `--trust` runs the package postinstall that downloads the platform binary.
      - name: Install OpenCode CLI
        run: |
          bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/opencode" --version

      - name: Integration tests (Go, real TUI)
        env:
          # Repo secret name; the tests read it as OPENCODE_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
        run: bun run --filter opencode-go-statusline test

      - name: Stage TUI frames
        if: always()
        run: |
          mkdir -p /tmp/tui-frames/opencode-go-statusline
          shopt -s nullglob
          files=(packages/opencode-go-statusline/test/e2e/.artifacts/*.txt)
          if (( ${#files[@]} > 0 )); then
            cp "${files[@]}" /tmp/tui-frames/opencode-go-statusline/
          fi

      - name: Upload TUI frames (go)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames-go
          path: /tmp/tui-frames/opencode-go-statusline
          if-no-files-found: ignore
          include-hidden-files: false

  copilot_integration:
    name: copilot (real TUI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # `--trust` runs the package postinstall that downloads the platform binary.
      - name: Install OpenCode CLI
        run: |
          bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/opencode" --version

      - name: Integration tests (Copilot, real TUI)
        env:
          # Repo secret name; the tests read it as COPILOT_GITHUB_TOKEN. Any
          # Copilot-enabled account works, including Copilot Free.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bun run --filter opencode-copilot-statusline test

      - name: Stage TUI frames
        if: always()
        run: |
          mkdir -p /tmp/tui-frames/opencode-copilot-statusline
          shopt -s nullglob
          files=(packages/opencode-copilot-statusline/test/e2e/.artifacts/*.txt)
          if (( ${#files[@]} > 0 )); then
            cp "${files[@]}" /tmp/tui-frames/opencode-copilot-statusline/
          fi

      - name: Upload TUI frames (copilot)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tui-frames-copilot
          path: /tmp/tui-frames/opencode-copilot-statusline
          if-no-files-found: ignore
          include-hidden-files: false

  # The `main-protection` ruleset requires a check named `ci`, so this fan-in
  # job stays named `ci` and fails unless every job above succeeded. It runs
  # even when a dependency fails so the required check reports the failure.
  ci:
    name: ci
    if: always()
    needs: [checks, go_integration, copilot_integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          CHECKS: ${{ needs.checks.result }}
          GO: ${{ needs.go_integration.result }}
          COPILOT: ${{ needs.copilot_integration.result }}
        run: |
          echo "checks=$CHECKS go=$GO copilot=$COPILOT"
          if [[ "$CHECKS" != "success" || "$GO" != "success" || "$COPILOT" != "success" ]]; then
            echo "::error::one or more CI jobs did not succeed"
            exit 1
          fi

      # Frames are published even when an integration job failed: they are the
      # most useful artifact for debugging a failed case.
      - name: Download TUI frames
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          # One artifact per package; not merging keeps them in per-statusline
          # folders under `frames/`.
          pattern: tui-frames-*
          path: frames
          merge-multiple: false

      - name: Publish TUI frames to the job summary
        if: always()
        run: |
          {
            echo "## TUI frames"
            echo
            found=0
            shopt -s nullglob
            for dir in frames/tui-frames-*/; do
              label="$(basename "$dir")"
              label="${label#tui-frames-}"
              files=("$dir"*.txt)
              for file in "${files[@]}"; do
                found=1
                echo "<details>"
                echo "<summary>${label} · $(basename "$file" .txt)</summary>"
                echo
                echo '```text'
                cat "$file"
                echo '```'
                echo
                echo "</details>"
                echo
              done
            done
            if (( ! found )); then
              echo "_No frames captured._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
