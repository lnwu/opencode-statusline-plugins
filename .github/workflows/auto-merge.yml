name: Auto-merge

# Wait for the required `ci` check to pass, then squash-merge the PR and delete
# its head branch. The merge is performed synchronously here instead of via
# GitHub's native auto-merge: when auto-merge is enabled with `GITHUB_TOKEN`,
# GitHub silently skips `delete_branch_on_merge` and suppresses the resulting
# push events on `main` (observed in this repository).
#
# Same-repo, non-draft PRs only: fork PRs receive a read-only token and are
# never auto-merged. Uses `pull_request` (never `pull_request_target`). Add the
# `manual-merge` label to opt a PR out; Renovate applies it to major updates.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'manual-merge')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Wait for the `ci` check to be registered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for _ in $(seq 1 60); do
            if gh pr checks "$PR" --json name --jq 'any(.[]; .name == "ci")' 2>/dev/null | grep -q '^true$'; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::the required 'ci' check did not appear within 10 minutes" >&2
          exit 1

      - name: Wait for the required checks to pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr checks "$PR" --watch --required --fail-fast

      - name: Squash-merge and delete the head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          branch="$(gh pr view "$PR" --json headRefName --jq .headRefName)"
          gh pr merge "$PR" --squash
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null || echo "head branch already deleted"
