name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve package from release tag
        id: target
        # Tag convention: <package-name>@<version>, e.g. opencode-go-statusline@0.1.5
        run: |
          tag="${{ github.event.release.tag_name }}"
          pkg="${tag%@*}"
          case "$pkg" in
            opencode-go-statusline|opencode-kimi-code-statusline|opencode-copilot-statusline) ;;
            *) echo "::error::unknown package in tag '$tag'"; exit 1 ;;
          esac
          [[ -f "packages/$pkg/package.json" ]] || { echo "::error::packages/$pkg not found"; exit 1; }
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=${tag##*@}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        env:
          PKG: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          actual="$(node -p "require('./packages/${PKG}/package.json').version")"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::tag version '$VERSION' does not match packages/${PKG}/package.json ($actual)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run --filter "${{ steps.target.outputs.package }}" build

      - name: Typecheck
        run: bun run --filter "${{ steps.target.outputs.package }}" typecheck

      - name: Fail if version is already published
        env:
          PKG: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::${PKG}@${VERSION} is already published on npm"
            exit 1
          fi

      # Authenticates via OIDC (npm trusted publishing); provenance is generated automatically.
      # Requires a Trusted Publisher configured on npmjs.com for this package pointing at
      # this repository and workflow filename (`publish.yml`).
      - name: Publish
        working-directory: packages/${{ steps.target.outputs.package }}
        run: npm publish
