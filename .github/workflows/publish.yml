name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Verify release tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"

      # Authenticates with npm via OIDC; provenance is generated automatically.
      # Requires a Trusted Publisher configured on npmjs.com for this repository
      # with workflow filename `publish.yml`.
      - name: Publish
        run: npm publish
