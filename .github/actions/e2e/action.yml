name: E2E setup and run
description: Install dependencies and the pinned OpenCode CLI, ensure tmux, run a package's real-TUI integration tests, and stage the captured frames.

inputs:
  package:
    description: Plugin package name (workspace filter and frame folder).
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # tmux ships with the ubuntu-24.04 runner image (verified: 3.4). Installing
    # it unconditionally costs ~6s of `apt-get update` for nothing, so only
    # install it when a future image drops it.
    - name: Ensure tmux
      shell: bash
      run: command -v tmux || { sudo apt-get update && sudo apt-get install -y tmux; }

    # `--trust` runs the package postinstall that downloads the platform binary.
    - name: Install OpenCode CLI
      shell: bash
      run: |
        bun add -g --trust "@opencode/cli@$OPENCODE_VERSION"
        echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
        "$HOME/.bun/bin/opencode" --version

    # The credential comes from the calling job's step env (see ci.yml).
    - name: Integration tests (${{ inputs.package }}, real TUI)
      shell: bash
      # Run from the package directory, not through `bun run --filter`: filter
      # mode prefixes every line with "<package> <script>: ", and the runner
      # only parses a workflow command at the start of a line — the prefix
      # turned Bun's `::group::` groups and `::error` failure annotations into
      # plain text (bun#43484, tracked in #79). This is the same working
      # directory `--filter` would use.
      run: |
        cd "packages/${{ inputs.package }}"
        bun run test:e2e

    # Frames are staged even when the tests failed: they are the most useful
    # artifact for debugging a failed case.
    - name: Stage TUI frames
      if: always()
      shell: bash
      run: |
        mkdir -p /tmp/tui-frames/${{ inputs.package }}
        shopt -s nullglob
        files=(packages/${{ inputs.package }}/test/e2e/.artifacts/*.txt)
        if (( ${#files[@]} > 0 )); then
          cp "${files[@]}" /tmp/tui-frames/${{ inputs.package }}/
        fi
